name: Publish NuGet

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.0.1)'
        required: true
        type: string

env:
  DOTNET_VERSION: 8.0.x
  CEF_VER: 109.1.11+g6d4fdb2+chromium-109.0.5414.87

# Trusted Publishing: OIDC token (id-token) lets us push to nuget.org without an API key
permissions:
  contents: read
  id-token: write

jobs:
  build-windows:
    needs: build-linux
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache CEF binaries
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: C:\cef
          key: cef-${{ env.CEF_VER }}

      - name: Download & extract CEF
        if: steps.cache-cef.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = "$env:CEF_VER"
          $url = "https://cef-builds.spotifycdn.com/cef_binary_${ver}_windows64.tar.bz2"
          New-Item C:\cef -ItemType Directory -Force
          Write-Host "Downloading $url ..."
          curl.exe -sL -o cef.tar.bz2 $url
          tar -xf cef.tar.bz2 -C C:\cef
          Remove-Item cef.tar.bz2
          Write-Host "CEF extracted to C:\cef"

      - name: Setup MSVC (VS 2022 v143)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set version
        shell: pwsh
        run: |
          # Priority: manual input > git tag > csproj default
          $ver = "${{ github.event.inputs.version }}"
          if ($ver) {
            "PACKAGE_VERSION=$ver" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Version from manual input: $ver"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}" -replace '^v', ''
            "PACKAGE_VERSION=$tag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Version from tag: $tag"
          } else {
            # Branch push — keep existing csproj version, don't override
            Write-Host "Branch push — using csproj version as-is"
          }

      - name: Update csproj version (tag/manual only)
        if: env.PACKAGE_VERSION != ''
        shell: pwsh
        run: |
          $csprojs = @(
            "CefSharp.Avalonia\CefSharp.Avalonia.csproj",
            "CefSharp.Avalonia.Linux\CefSharp.Avalonia.Linux.csproj"
          )
          foreach ($csproj in $csprojs) {
            (Get-Content $csproj) -replace '<Version>.*?</Version>', "<Version>$env:PACKAGE_VERSION</Version>" | Set-Content $csproj
            Write-Host "Updated $csproj version to $env:PACKAGE_VERSION"
          }

      - name: CMake configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCEF_ROOT="C:/cef/cef_binary_${{ env.CEF_VER }}_windows64" `
            -DCMAKE_MODULE_PATH="C:/cef/cef_binary_${{ env.CEF_VER }}_windows64/cmake"
        working-directory: CefBrowser.Native

      - name: Build native
        run: cmake --build build --config Release
        working-directory: CefBrowser.Native

      # Note: CefBrowser.Native.exe must be built BEFORE the dotnet build,
      # because the csproj's <Content> items reference ..\CefBrowser.Native\build\Release\*
      - name: Download Linux native (merge into the package)
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/native-linux-x64

      # Diagnostics: the Linux package must stay well under NuGet.org's 250 MB
      # limit. Print what the native build actually produced so an oversized
      # package can be traced to a specific file instead of guessed at.
      - name: Audit Linux native dir (size check)
        shell: pwsh
        run: |
          $dir = "${{ github.workspace }}\artifacts\native-linux-x64"
          $files = Get-ChildItem $dir -Recurse -File
          "TOTAL: {0:N1} MB in {1} files" -f (($files | Measure-Object Length -Sum).Sum / 1MB), $files.Count
          $files | Sort-Object Length -Descending | Select-Object -First 20 `
            @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, `
            @{n='File';e={$_.FullName.Substring($dir.Length)}} | Format-Table -AutoSize | Out-String

      - name: Pack CefSharp.Avalonia (managed + Windows natives)
        run: dotnet pack CefSharp.Avalonia\CefSharp.Avalonia.csproj -c Release -o artifacts

      - name: Pack CefSharp.Avalonia.Linux (Linux natives)
        run: |
          dotnet pack CefSharp.Avalonia.Linux\CefSharp.Avalonia.Linux.csproj -c Release -o artifacts `
            -p:CefNativeLinuxDir="${{ github.workspace }}\artifacts\native-linux-x64"

      # Build the demo app too, so compile errors surface in CI (it also copies
      # the native host + CEF binaries next to the assembly).
      - name: Build demo app (smoke)
        run: dotnet build TestBrowserApp\TestBrowserApp.csproj -c Release

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts\*.nupkg
          if-no-files-found: error

      # Trusted Publishing: exchange the Actions OIDC token for a short-lived
      # NuGet API key (dotnet nuget push cannot do this exchange by itself).
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: yhq   # nuget.org account (package owner)

      - name: Push to nuget.org (trusted publishing)
        if: env.PACKAGE_VERSION != ''
        run: |
          Get-ChildItem artifacts\*.nupkg | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }
          $tooBig = Get-ChildItem artifacts\*.nupkg | Where-Object { $_.Length -gt 250MB }
          if ($tooBig) {
            $tooBig | ForEach-Object { Write-Host "::error::$($_.Name) is $([math]::Round($_.Length/1MB,1)) MB — NuGet.org limit is 250 MB" }
            exit 1
          }
          dotnet nuget push artifacts\*.nupkg `
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install CEF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev

      - name: Cache CEF binaries
        id: cache-cef-linux
        uses: actions/cache@v4
        with:
          path: ~/cef
          key: cef-linux-${{ env.CEF_VER }}

      - name: Download & extract CEF (Linux64)
        if: steps.cache-cef-linux.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.CEF_VER }}"
          URL="https://cef-builds.spotifycdn.com/cef_binary_${VER}_linux64.tar.bz2"
          mkdir -p ~/cef
          curl -sL -o ~/cef/cef.tar.bz2 "$URL"
          tar -xf ~/cef/cef.tar.bz2 -C ~/cef
          rm ~/cef/cef.tar.bz2

      - name: Build native (Linux)
        working-directory: CefBrowser.Native
        run: |
          CEF=~/cef/cef_binary_${{ env.CEF_VER }}_linux64
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCEF_ROOT="$CEF" -DCMAKE_MODULE_PATH="$CEF/cmake"
          cmake --build build --config Release

      - name: Upload Linux native (for the merged package)
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: CefBrowser.Native/build/Release/
          if-no-files-found: error

      - name: Build .NET library
        run: dotnet build CefSharp.Avalonia/CefSharp.Avalonia.csproj -c Release

      # Publish a runnable Linux bundle (CEF + native host are copied and +x is
      # re-applied by the csproj). NOTE: use $HOME, not '~' — a literal '~' inside
      # a -p: argument is NOT expanded by the shell and silently points
      # CefLinuxRoot at a non-existent path.
      - name: Publish demo app (linux-x64)
        run: |
          dotnet publish TestBrowserApp/TestBrowserApp.csproj -c Release -r linux-x64 \
            -o publish-linux \
            -p:CefLinuxRoot="$HOME/cef/cef_binary_${{ env.CEF_VER }}_linux64"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: CefBrowser-Linux-x64
          path: publish-linux/
          if-no-files-found: error
