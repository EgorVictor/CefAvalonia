name: CEF Linux runtime asset

# Publishes libcef.so as a GitHub Release asset.
#
# It cannot live inside the NuGet package: ~1.05 GB raw / ~240 MB compressed,
# which on its own blows NuGet.org's 250 MB per-package limit. Instead
# CefRuntimeResolver downloads this asset on first run, verifies its SHA-256 and
# caches it under ~/.cache/cefavalonia/libcef/<version>.
#
# Manual trigger only. Do NOT re-add a 'push: tags: cef-runtime-*' trigger:
# the release is immutable, so the workflow's asset upload would fail after a
# manually published release — the manually uploaded asset is authoritative.
# After publishing, copy the SHA-256 of the uploaded file into
# CefRuntimeResolver.ReleaseAssetSha256.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CEF_VER: 109.1.11+g6d4fdb2+chromium-109.0.5414.87
  CEF_SHORT_VER: 109.1.11
  CEF_RUNTIME_TAG: cef-runtime-109.1.11

jobs:
  upload-libcef:
    runs-on: ubuntu-latest

    steps:
      - name: Cache CEF binaries
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: ~/cef
          key: cef-linux-${{ env.CEF_VER }}

      - name: Download & extract CEF (Linux64)
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: |
          URL="https://cef-builds.spotifycdn.com/cef_binary_${{ env.CEF_VER }}_linux64.tar.bz2"
          mkdir -p ~/cef
          curl -sL -o ~/cef/cef.tar.bz2 "$URL"
          tar -xf ~/cef/cef.tar.bz2 -C ~/cef
          rm ~/cef/cef.tar.bz2

      - name: Package libcef.so
        run: |
          set -euo pipefail
          cd "$HOME/cef/cef_binary_${{ env.CEF_VER }}_linux64/Release"
          OUT="$RUNNER_TEMP/libcef-${{ env.CEF_SHORT_VER }}-linux-x64.tar.gz"
          # Reproducible: deterministic tar metadata + gzip without name/timestamp,
          # so the produced bytes (and therefore the SHA-256) are stable across runs
          # and match CefRuntimeResolver.ReleaseAssetSha256.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - libcef.so | gzip -n -c > "$OUT"
          ls -lh "$OUT"

      - name: Compute SHA-256
        id: sha
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/libcef-${{ env.CEF_SHORT_VER }}-linux-x64.tar.gz"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### libcef.so asset SHA-256"
            echo ""
            echo '```'
            echo "$SHA"
            echo '```'
            echo ""
            echo "Paste this value into \`CefRuntimeResolver.ReleaseAssetSha256\`."
            echo "Until then the runtime download is refused (unverified binaries are never fetched)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET="$RUNNER_TEMP/libcef-${{ env.CEF_SHORT_VER }}-linux-x64.tar.gz"
          if gh release view "${{ env.CEF_RUNTIME_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ env.CEF_RUNTIME_TAG }}" "$ASSET" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ env.CEF_RUNTIME_TAG }}" "$ASSET" \
              --repo "${{ github.repository }}" \
              --title "CEF ${{ env.CEF_SHORT_VER }} Linux x64 runtime (libcef.so)" \
              --latest=false \
              --notes "libcef.so only, consumed by CefRuntimeResolver on first run. SHA-256: ${{ steps.sha.outputs.sha256 }}"
          fi
